# Codecov: the coverage half of the quality gate.
#
# The number this file governs is the one ci.yml uploads, `artifacts/coverage/net11.0.cobertura.xml`, which
# is the same measurement SonarCloud reads. Sonar enforces its own 80% rule on new code; this file states the
# target this repository actually holds itself to, 90%, and applies it to the project as a whole and to the
# lines a pull request touches.
#
# Why 90 and not 100: the uncovered remainder is defensive code for documents that a hand-built fixture
# cannot easily produce (a page tree that is deeper than the reader allows, an object whose stream length
# runs past the end of the file, the AES padding of a truncated value). Chasing those would mean tests that
# assert on fabricated bytes rather than on behaviour. The library measures 92% today, so 90 is a floor
# with room to refactor under it, not a target that has to be scraped past.
#
# `ignore` is what makes the number mean "the code that ships": the cobertura report carries the test
# project too, and a test suite covering itself is not coverage of anything.

codecov:
  # A run that never got as far as the tests should not be reported as a coverage drop.
  require_ci_to_pass: true
  notify:
    wait_for_ci: true

coverage:
  precision: 2
  round: down
  # The colour range of the badge and of the pull-request comment.
  range: "80...100"

  status:
    # The whole project, measured against the fixed floor. `threshold` allows half a point of movement
    # without a comment, so a refactor that moves one branch does not fail on rounding.
    project:
      default:
        target: 90%
        threshold: 0.5%
        if_ci_failed: error
        informational: false

    # The lines the change itself touches. This is the status that stops a new 400-line class shipped
    # without tests, which a 92% project number would absorb without noticing. The wider threshold is
    # deliberate: a ten-line change to a guard clause can move the patch number by more than the project one.
    patch:
      default:
        target: 90%
        threshold: 5%
        if_ci_failed: error
        informational: false

comment:
  # The pull-request comment: what moved, by how much, and which files. No sunburst, no per-flag noise.
  layout: "condensed_header, diff, condensed_files, condensed_footer"
  behavior: default
  require_changes: false
  require_base: false
  require_head: true

# Paths that are in the report but are not the product. Everything under `src/` is measured.
ignore:
  - "tests/**"
  - "examples/**"
  - "tools/**"
  - "docs/**"
  - "artifacts/**"
  - "_bmad/**"
  - "_bmad-output/**"
  - ".cline/**"
  - "**/*.g.cs"
