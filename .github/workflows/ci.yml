# Continuous integration: the build, both test legs, coverage, and the SonarCloud analysis.
#
# This workflow and publish.yml answer different questions and are deliberately separate. publish.yml
# answers "does this version reach the feed, and is it the version the tag names", and it runs on a tag
# or on a manual dispatch. This one answers "does main still build, do the tests still pass, and what does
# a static analyzer say about the change", and it runs on a push to main and on every pull request. A tag
# therefore runs both; a pull request runs only this one.
#
# The analysis runs in the runner instead of as Automatic Analysis because Automatic Analysis cannot
# import coverage: it analyses on SonarCloud's side, where no instrumented test run exists. The scanner
# session opens before the build and closes after the tests, so the analysis uploads the assemblies this
# run built and the coverage this run measured.
#
# Every property is passed on `begin`. The SonarScanner for .NET does not read sonar-project.properties --
# that file belongs to Automatic Analysis -- so one here would be read by nobody. The project has to exist
# on SonarCloud under the key and the organisation passed below:
#
#   key           MPCoreDeveloper_SharpCorePDF
#   organisation  mpcoredeveloper
#
# A project that does not exist yet fails `begin` with "Project not found", and Automatic Analysis must be
# switched off in that project (Administration -> Analysis Method): a repository cannot be analysed both
# ways at once, and with Automatic Analysis on, `end` fails with "You are running CI analysis while
# Automatic Analysis is enabled".
#
# SONAR_TOKEN gates the scan, and the gate is decided in a small first job because a job-level `if` cannot
# read a secret. A fork, or a repository where the secret has not been added yet, still gets a green run
# for the build and the tests; it simply gets no analysis. ServiceMq carries the same gate in a workflow
# of its own, and gates the scanner steps with a job output; here the scan has to wrap this job's own build
# and test steps, because that is the only way the scanner can see them.
#
# Coverage comes from `dotnet-coverage collect`, not from `dotnet test --collect`. global.json pins
# Microsoft.Testing.Platform as the test runner, and the VSTest-only switches (`--collect "XPlat Code
# Coverage"`, `--logger trx`, `--blame-hang`) are rejected there; the xUnit v3 host registers no coverage
# extension either. The collector's `xml` format is the Visual Studio coverage XML that
# `sonar.cs.vscoveragexml.reportsPaths` reads, and the same report is kept as an artifact, so the number can
# be read without opening SonarCloud.
#
# SonarCloud holds the whole gate, coverage included, and the gate is enforced rather than reported:
# `sonar.qualitygate.wait` on `end` makes the step wait for the analysis and fail when the gate fails, so a
# change that lowers coverage is a red run rather than a stale badge. The threshold itself lives in the
# quality gate on sonarcloud.io -- Sonar's default is 80% on new code, and this repository wants 90% there
# instead -- because a number declared in this repository would be a message to nobody.
#
# The scan is gated on a secret, so a pull request from a fork builds and tests without asking for
# credentials it does not have.
#
# Actions are pinned to commit hashes, not tags, because a tag is a moving reference and these steps run
# with a token in scope. The `# vN` comment is what a person reads; Dependabot is what moves it.

name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # A job-level `if` cannot read secrets, so the presence of SONAR_TOKEN is decided here and consumed
  # through `needs` below. This is the gate ServiceMq's workflow uses.
  check-sonar-token:
    name: Check the SonarCloud token
    runs-on: ubuntu-latest
    outputs:
      has-token: ${{ steps.check.outputs.defined }}
    steps:
      - id: check
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: |
          if [ -n "$SONAR_TOKEN" ]; then
            echo "defined=true" >> "$GITHUB_OUTPUT"
          else
            echo "defined=false" >> "$GITHUB_OUTPUT"
          fi

  build-test-sonar:
    name: Build, test and analyse
    runs-on: ubuntu-latest
    needs: check-sonar-token
    timeout-minutes: 45

    steps:
      # SonarCloud attributes findings to commits and decorates a pull request from the git history, which
      # a shallow clone does not carry.
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      # Both SDKs, for the reason publish.yml records: the .NET 11 SDK is not on the hosted images yet,
      # and the 11.0 SDK on its own cannot produce the net10.0 app host the test project needs (MSB3030).
      - name: Install the .NET SDKs
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6
        with:
          dotnet-version: |
            11.0.x
            10.0.x

      # The scanner engine is a Java process. The hosted image happens to carry a JDK; pinning one is what
      # keeps the scan from depending on that. `zulu` and a 17 toolchain are still first-class in v5; what
      # v5 retired is the legacy `adopt*` distributions, which this line never named.
      - name: Set up the JDK the scanner engine runs on
        if: needs.check-sonar-token.outputs.has-token == 'true'
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Cache the SonarCloud cache
        if: needs.check-sonar-token.outputs.has-token == 'true'
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ~/.sonar/cache
          key: ${{ runner.os }}-sonar
          restore-keys: ${{ runner.os }}-sonar

      # Installed into ./.tools rather than globally, so that every later step names the exact binary it
      # runs. Both are git-ignored. The collector is installed unconditionally, because the report is also
      # kept as an artifact on a run where no SonarCloud token exists.
      - name: Install the coverage collector
        run: dotnet tool install --tool-path ./.tools dotnet-coverage

      - name: Install the SonarScanner
        if: needs.check-sonar-token.outputs.has-token == 'true'
        run: dotnet tool install --tool-path ./.tools dotnet-sonarscanner

      # On a pull request the analysis is a pull-request analysis, which is what makes SonarCloud decorate
      # the pull request; on a branch it is a branch analysis. The array keeps both shapes in one step, the
      # way ServiceMq's workflow does.
      - name: Begin the SonarCloud analysis
        if: needs.check-sonar-token.outputs.has-token == 'true'
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_BRANCH: ${{ github.head_ref }}
          PR_BASE: ${{ github.base_ref }}
        run: |
          # Excluded: build and test output; the BMad Method bundle (_bmad, _bmad-output, .cline), which is
          # somebody else's Python and JavaScript rather than this repository's code; the scanner's own
          # working directory; and docs/, tools/ and examples/, because the gate is about what the packages
          # ship. src/ is analysed as source and tests/ as test code, since the test project sets
          # IsTestProject.
          args=(
            "/k:MPCoreDeveloper_SharpCorePDF"
            "/o:mpcoredeveloper"
            "/d:sonar.host.url=https://sonarcloud.io"
            "/d:sonar.token=$SONAR_TOKEN"
            "/d:sonar.sourceEncoding=UTF-8"
            "/d:sonar.scm.provider=git"
            "/d:sonar.exclusions=**/bin/**,**/obj/**,**/artifacts/**,**/TestResults/**,**/.sonarqube/**,**/_bmad/**,**/_bmad-output/**,**/.cline/**,**/docs/**,**/tools/**,**/examples/**"
            # Exactly one file: this is the only coverage report the run produces.
            "/d:sonar.cs.vscoveragexml.reportsPaths=artifacts/coverage/net11.0.xml"
            # Asked for here rather than on `end`: the post-processing phase accepts no property but the
            # token and stops with "not valid in the end phase" for anything else. Set here it reaches the
            # engine, which waits for the compute engine and fails the step when the gate fails — the
            # difference between a badge and a gate.
            "/d:sonar.qualitygate.wait=true"
            "/d:sonar.qualitygate.timeout=600"
          )
          if [ -n "$PR_NUMBER" ]; then
            args+=(
              "/d:sonar.pullrequest.key=$PR_NUMBER"
              "/d:sonar.pullrequest.branch=$PR_BRANCH"
              "/d:sonar.pullrequest.base=$PR_BASE"
            )
          fi
          ./.tools/dotnet-sonarscanner begin "${args[@]}"

      # --no-incremental inside a scan session: the scanner's targets have to see every source file it
      # analyses, and an incremental build is free to recompile nothing.
      - name: Build
        run: dotnet build ./SharpCorePDF.slnx -c Release --no-incremental

      # One instrumented run rather than a plain one followed by a measured one: the collector has to wrap
      # the test host, so testing and then collecting would run the suite twice for one number. Nothing
      # gates this step, because the measurement is kept as an artifact whether or not the token exists.
      - name: Test on net11.0, under the coverage collector
        run: |
          mkdir -p ./artifacts/coverage
          ./.tools/dotnet-coverage collect \
            -f coverage \
            -o ./artifacts/coverage/net11.0.coverage \
            "dotnet test ./tests/SharpCorePDF.Tests/SharpCorePDF.Tests.csproj -c Release -p:TargetFramework=net11.0"

      # Both legs, per README: the RID-less net10.0 leg of some SDK builds skips the app host the test
      # project needs, so the net10.0 run names a runtime. The coverage collector is not wrapped around this
      # leg as well: the same source lines are instrumented either way, and the suite would run twice more.
      - name: Test on net10.0
        run: dotnet test ./tests/SharpCorePDF.Tests/SharpCorePDF.Tests.csproj -c Release -p:TargetFramework=net10.0 -r linux-x64

      # The binary report is converted to the Visual Studio coverage XML, which is the only shape anything
      # downstream reads: `sonar.cs.vscoveragexml.reportsPaths` on `begin` names this file.
      - name: Convert the coverage report
        run: |
          ./.tools/dotnet-coverage merge -f xml -o ./artifacts/coverage/net11.0.xml ./artifacts/coverage/net11.0.coverage
          ls -l ./artifacts/coverage

      - name: Upload the coverage report
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: coverage-net11.0
          path: artifacts/coverage/net11.0.*
          if-no-files-found: ignore
          retention-days: 14

      # Last, and only when everything before it succeeded: `end` uploads the analysis, and an analysis of
      # a build that failed is not worth a report.
      - name: End the SonarCloud analysis
        if: needs.check-sonar-token.outputs.has-token == 'true'
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        # Only the token: this phase validates its properties and rejects everything it did not define,
        # so the gate settings live on `begin` above.
        run: |
          ./.tools/dotnet-sonarscanner end \
            "/d:sonar.token=$SONAR_TOKEN"
